<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Arabian Night to Cosmic Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340854" />
      <stop offset="50%" stop-color="#1d0636" />
      <stop offset="100%" stop-color="#0c0217" />
    </linearGradient>

    <!-- Gold Gradient for Arcade Button -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff07c" />
      <stop offset="45%" stop-color="#ffbe1a" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ffbf1" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>

    <!-- Filter for Neobrutalist Shadow -->
    <filter id="neoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="14" stdDeviation="0" flood-color="#070110" />
    </filter>
  </defs>

  <!-- Base Badge / Squircle with Neobrutalist Border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="110"
    fill="url(#bgGrad)"
    stroke="#ffca3a"
    stroke-width="22"
    filter="url(#neoShadow)"
  />

  <!-- Subtle Inner Golden Border -->
  <rect
    x="44"
    y="44"
    width="424"
    height="424"
    rx="90"
    fill="none"
    stroke="rgba(255, 202, 58, 0.25)"
    stroke-width="5"
    stroke-dasharray="12 10"
  />

  <!-- Decorative Arabian / Arcade Stars in Corners -->
  <!-- Top Left Star -->
  <path
    d="M 105 75 Q 105 100 80 100 Q 105 100 105 125 Q 105 100 130 100 Q 105 100 105 75 Z"
    fill="#ffe600"
  />
  <!-- Bottom Right Star -->
  <path
    d="M 405 385 Q 405 410 380 410 Q 405 410 405 435 Q 405 410 430 410 Q 405 410 405 385 Z"
    fill="#5ffbf1"
  />

  <!-- 3D Shadow for the Play Arrow -->
  <path
    d="M 195 130 L 385 256 L 195 382 Z"
    fill="#080112"
    stroke="#080112"
    stroke-width="28"
    stroke-linejoin="round"
  />

  <!-- Main Golden Play Button ("Press Play") -->
  <path
    d="M 185 120 L 375 246 L 185 372 Z"
    fill="url(#goldGrad)"
    stroke="#0f051d"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Gloss Highlight across the Play Button -->
  <path
    d="M 195 142 L 340 240 L 195 240 Z"
    fill="rgba(255, 255, 255, 0.45)"
  />

  <!-- Arcade Controller Button Accents (Upper Right & Lower Left) -->
  <circle cx="395" cy="115" r="14" fill="#ff4757" stroke="#080112" stroke-width="6" />
  <circle cx="115" cy="395" r="14" fill="#2ed573" stroke="#080112" stroke-width="6" />
</svg>
